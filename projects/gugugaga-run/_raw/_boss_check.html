<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕咕嘎嘎快跑 · GUGU GAGA DASH</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background: radial-gradient(120% 120% at 50% 20%, #5b3a8c 0%, #35204f 45%, #241536 100%);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:'ZCOOL KuaiLe','Baloo 2','PingFang SC','Microsoft YaHei',sans-serif;
    color:#4a2b57; user-select:none; -webkit-user-select:none;
  }
  #wrap {
    position:relative; width:min(96vw, calc(94vh * 16 / 9)); aspect-ratio:16/9;
    border-radius:18px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.55);
    background:#ffd9ec; touch-action:manipulation; cursor:pointer;
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ===== HUD ===== */
  #hud { position:absolute; inset:0; z-index:5; pointer-events:none; font-family:'Baloo 2','ZCOOL KuaiLe','PingFang SC',sans-serif; }
  #hud .chip {
    position:absolute; background:rgba(255,255,255,.82); border:3px solid #fff;
    border-radius:16px; box-shadow:0 4px 14px rgba(74,43,87,.22); padding:4px 14px;
  }
  #scoreBox { top:12px; left:12px; display:flex; align-items:baseline; gap:8px; }
  #scoreLabel { font-size:13px; color:#b06bd9; letter-spacing:2px; }
  #scoreVal { font-size:30px; font-weight:800; color:#4a2b57; line-height:1; }
  #hearts { top:16px; left:150px; display:flex; gap:4px; padding:6px 10px; }
  #hearts svg { width:22px; height:22px; display:block; filter:drop-shadow(0 2px 3px rgba(74,43,87,.25)); }
  #combo { top:56px; left:12px; font-size:24px; font-weight:800; color:#ff5f8f;
    text-shadow:0 2px 0 #fff, 0 4px 10px rgba(255,95,143,.45); display:none; }
  #combo.show { display:block; animation:comboPop .25s ease; }
  @keyframes comboPop { 0%{transform:scale(1.6)} 100%{transform:scale(1)} }
  #bossWrap { position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:min(42%,320px); display:none; flex-direction:column; align-items:center; gap:4px; }
  #bossName { font-size:15px; color:#fff; background:#4a2b57; padding:2px 14px; border-radius:999px;
    box-shadow:0 3px 8px rgba(0,0,0,.3); letter-spacing:1px; }
  #bossBar { width:100%; height:14px; background:rgba(74,43,87,.25); border:3px solid #fff;
    border-radius:999px; overflow:hidden; box-shadow:0 3px 10px rgba(74,43,87,.25); }
  #bossFill { height:100%; width:100%; background:linear-gradient(90deg,#ff6fa5,#ff9d4d);
    border-radius:999px; transition:width .18s ease; }
  #topBtns { position:absolute; top:12px; right:12px; display:flex; gap:8px; }
  #topBtns button {
    pointer-events:auto; width:40px; height:40px; border-radius:14px; border:3px solid #fff;
    background:rgba(255,255,255,.82); box-shadow:0 4px 14px rgba(74,43,87,.22);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s;
  }
  #topBtns button:hover { transform:scale(1.08); }
  #topBtns button:active { transform:scale(.94); }
  #topBtns svg { width:20px; height:20px; fill:#4a2b57; }
  #topBtns button.off svg { fill:#c9a8d9; }

  /* ===== 覆盖层 ===== */
  .screen { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(52,31,76,.42); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    padding:20px; }
  .screen.hidden { display:none !important; }
  .screen h1 { font-size:clamp(34px,6.5vw,64px); color:#fff; letter-spacing:4px;
    text-shadow:0 4px 0 #e94f9a, 0 8px 24px rgba(0,0,0,.35); line-height:1.1; }
  .screen h2 { font-size:clamp(26px,4.4vw,44px); color:#fff; letter-spacing:3px;
    text-shadow:0 3px 0 #e94f9a, 0 6px 18px rgba(0,0,0,.35); }
  .sub { color:#ffe9f5; font-size:clamp(13px,1.8vw,18px); letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,.35); max-width:70%; line-height:1.7; }
  .titleArt { display:flex; align-items:flex-end; gap:26px; margin-bottom:2px; }
  .titleArt img { height:clamp(80px,16vh,150px); filter:drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  .titleArt .peng { animation:bob 1.1s ease-in-out infinite; }
  .titleArt .doro { animation:bob 1.3s ease-in-out infinite reverse; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .bigBtn {
    font-family:inherit; font-size:clamp(18px,2.6vw,26px); color:#fff; letter-spacing:3px;
    background:linear-gradient(180deg,#ff7ab0,#ff4d8d); border:none; border-radius:999px;
    padding:14px 54px; cursor:pointer; box-shadow:0 6px 0 #c92c6d, 0 12px 26px rgba(233,79,154,.45);
    transition:transform .12s, box-shadow .12s; margin-top:6px;
  }
  .bigBtn:hover { transform:translateY(-2px) scale(1.03); }
  .bigBtn:active { transform:translateY(3px); box-shadow:0 2px 0 #c92c6d, 0 6px 14px rgba(233,79,154,.4); }
  .bigBtn.green { background:linear-gradient(180deg,#7ad7a8,#43b983); box-shadow:0 6px 0 #2c8a5c, 0 12px 26px rgba(67,185,131,.45); }
  .bigBtn.ghost { background:rgba(255,255,255,.16); border:3px solid rgba(255,255,255,.8);
    box-shadow:0 6px 0 rgba(255,255,255,.25), 0 10px 20px rgba(0,0,0,.2); }
  .btnRow { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .hint { color:#ffd9ec; font-size:clamp(11px,1.4vw,14px); letter-spacing:1px; line-height:1.9;
    text-shadow:0 2px 4px rgba(0,0,0,.4); background:rgba(0,0,0,.18); padding:8px 18px; border-radius:12px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .stat { background:rgba(255,255,255,.9); border:3px solid #fff; border-radius:16px;
    padding:8px 20px; box-shadow:0 4px 14px rgba(74,43,87,.22); min-width:110px; }
  .stat .k { font-size:12px; color:#b06bd9; letter-spacing:2px; }
  .stat .v { font-size:26px; font-weight:800; color:#4a2b57; line-height:1.2; }
  .banner {
    position:absolute; top:22%; left:50%; transform:translate(-50%,-50%) scale(0);
    z-index:8; background:#ff4d8d; color:#fff; font-size:clamp(20px,3.4vw,34px);
    padding:12px 36px; border-radius:999px; letter-spacing:3px; border:4px solid #fff;
    box-shadow:0 8px 30px rgba(0,0,0,.4); white-space:nowrap; opacity:0;
  }
  .banner.pop { animation:bannerPop 1.6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bannerPop {
    0%{transform:translate(-50%,-50%) scale(0); opacity:0}
    14%{transform:translate(-50%,-50%) scale(1.15); opacity:1}
    24%{transform:translate(-50%,-50%) scale(1); opacity:1}
    82%{transform:translate(-50%,-50%) scale(1); opacity:1}
    100%{transform:translate(-50%,-50%) scale(.9); opacity:0}
  }
  .loading { color:#fff; font-size:16px; letter-spacing:2px; }
  @media (max-width:640px) {
    #hearts { left:12px; top:62px; }
    #scoreVal { font-size:24px; }
    #topBtns { top:8px; right:8px; gap:6px; }
    #topBtns button { width:40px; height:40px; }
    .hint { font-size:12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="chip" id="scoreBox"><span id="scoreLabel">分数</span><span id="scoreVal">0</span></div>
    <div class="chip" id="hearts"></div>
    <div id="combo">COMBO ×<span id="comboVal">1</span></div>
    <div id="bossWrap">
      <div id="bossName">doro</div>
      <div id="bossBar"><div id="bossFill"></div></div>
    </div>
    <div id="topBtns">
      <button id="btnPause" title="暂停 (P)"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="btnMute" title="音乐 (M)"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg></button>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <!-- 标题 -->
  <div id="screenTitle" class="screen">
    <div class="titleArt">
      <img class="peng" src="assets/player.png" alt="咕咕嘎嘎">
      <img class="doro" src="assets/boss.png" alt="doro">
    </div>
    <h1>咕咕嘎嘎快跑</h1>
    <div class="sub">GUGU GAGA DASH · 踩着节拍收集音符，召唤并击败大 boss doro！</div>
    <button id="btnStart" class="bigBtn">开始游戏</button>
    <div class="hint">空格 / ↑ / W / 点击：跳跃（可二段跳）　·　P 暂停　·　M 音乐</div>
    <div id="loadingText" class="loading">素材加载中…</div>
  </div>

  <!-- 暂停 -->
  <div id="screenPause" class="screen hidden">
    <h2>暂停中</h2>
    <div class="btnRow">
      <button id="btnResume" class="bigBtn green">继续</button>
      <button id="btnRestart" class="bigBtn ghost">重新开始</button>
      <button id="btnQuit" class="bigBtn ghost">回标题</button>
    </div>
  </div>

  <!-- 游戏结束 -->
  <div id="screenOver" class="screen hidden">
    <h2>咕咕嘎嘎倒下了…</h2>
    <div class="stats">
      <div class="stat"><div class="k">本局分数</div><div class="v" id="overScore">0</div></div>
      <div class="stat"><div class="k">最高纪录</div><div class="v" id="overBest">0</div></div>
      <div class="stat"><div class="k">最大连击</div><div class="v" id="overCombo">0</div></div>
      <div class="stat"><div class="k">收集音符</div><div class="v" id="overNotes">0</div></div>
    </div>
    <div class="btnRow">
      <button id="btnRetry" class="bigBtn">再来一局</button>
      <button id="btnHome" class="bigBtn ghost">回标题</button>
    </div>
  </div>

  <!-- 胜利 -->
  <div id="screenWin" class="screen hidden">
    <h2>胜利！咕咕嘎嘎打败了 doro！</h2>
    <div class="stats">
      <div class="stat"><div class="k">本局分数</div><div class="v" id="winScore">0</div></div>
      <div class="stat"><div class="k">最高纪录</div><div class="v" id="winBest">0</div></div>
      <div class="stat"><div class="k">最大连击</div><div class="v" id="winCombo">0</div></div>
      <div class="stat"><div class="k">收集音符</div><div class="v" id="winNotes">0</div></div>
    </div>
    <div class="btnRow">
      <button id="btnAgain" class="bigBtn">再来一局</button>
      <button id="btnHome2" class="bigBtn ghost">回标题</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 常量 ============ */
const W = 960, H = 540;
const GROUND = 470;                       // 地面高度（脚底 y）
const GRAV = 2150, JUMP_V = 720, JUMP_V2 = 650;
const BEAT = 60 / 128;                    // 一拍时长（128 BPM）
const STEP_16 = BEAT / 4;                 // 十六分音符
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* ============ DOM ============ */
const $ = (id) => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const elScore = $('scoreVal'), elCombo = $('combo'), elComboVal = $('comboVal'),
      elHearts = $('hearts'), elBossWrap = $('bossWrap'), elBossFill = $('bossFill'),
      banner = $('banner'), loadingText = $('loadingText');

/* ============ 素材 ============ */
const imgs = { player: new Image(), boss: new Image(), bg: new Image() };
imgs.player.src = 'assets/player.png';
imgs.boss.src = 'assets/boss.png';
imgs.bg.src = 'assets/bg.jpg';
let imgLoaded = 0, imgReady = false;
const readyImg = () => {
  imgLoaded++;
  if (imgLoaded >= 3) {
    imgReady = true;
    loadingText.textContent = '';
    $('btnStart').disabled = false;
  }
};
imgs.player.onload = readyImg;
imgs.boss.onload = readyImg;
imgs.bg.onload = readyImg;

/* ============ 音频引擎（Web Audio 程序化配乐） ============ */
let AC = null, masterGain = null, musicGain = null, sfxGain = null;
let musicOn = true, musicStep = 0, nextStepT = 0, schedTimer = null;
const BASS = [33, 33, 45, 33, 40, 40, 43, 40, 38, 38, 50, 38, 43, 43, 47, 43,
              33, 33, 45, 33, 40, 40, 43, 40, 45, 43, 40, 38, 47, 50, 52, 50];
const LEAD = [72, null, 76, null, 79, null, 84, null, 79, null, 76, null, 72, null, 74, null,
              76, null, 79, null, 83, null, 79, null, 76, null, 74, null, 71, null, 67, null];

function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = musicOn ? 1 : 0; masterGain.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.20; musicGain.connect(masterGain);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(masterGain);
  musicStep = 0; nextStepT = AC.currentTime + 0.08;
  schedTimer = setInterval(scheduleMusic, 30);
}
function currentBeat() { return AC ? (musicStep / 4 + (AC.currentTime - nextStepT) / BEAT) : (game.t / BEAT); }
function toggleMusic() {
  musicOn = !musicOn;
  $('btnMute').classList.toggle('off', !musicOn);
  if (masterGain) masterGain.gain.value = musicOn ? 1 : 0;
}
function tone(freq, t, dur, type, vol, glideTo, dest) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, vol, filterFreq, dest) {
  if (!AC) return;
  const len = Math.max(1, (dur * AC.sampleRate) | 0);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest || sfxGain);
  src.start(t);
}
function scheduleMusic() {
  if (!AC) return;
  while (nextStepT < AC.currentTime + 0.14) {
    const s = musicStep % 32, t = nextStepT;
    if (s % 4 === 0) tone(150, t, 0.14, 'sine', 0.9, 48, musicGain);               // 底鼓
    if (s % 8 === 4) noise(t, 0.06, 0.28, 2600, musicGain);                          // 军鼓
    if (s % 2 === 1) noise(t, 0.03, 0.10, 9000, musicGain);                          // 踩镲
    if (BASS[s] != null) tone(midiHz(BASS[s]), t, STEP_16 * 1.9, 'triangle', 0.42, 0, musicGain);
    if (LEAD[s] != null) tone(midiHz(LEAD[s]), t, STEP_16 * 1.4, 'square', 0.10, 0, musicGain);
    nextStepT += STEP_16; musicStep++;
  }
}
function sfxJump() { tone(320, AC ? AC.currentTime : 0, 0.13, 'sine', 0.5, 680); }
function sfxDoubleJump() { tone(420, AC ? AC.currentTime : 0, 0.15, 'sine', 0.5, 980); }
function sfxCollect() {
  const t = AC ? AC.currentTime : 0;
  tone(880, t, 0.10, 'sine', 0.5); tone(1318, t + 0.07, 0.16, 'sine', 0.5);
}
function sfxHurt() { const t = AC ? AC.currentTime : 0; tone(320, t, 0.30, 'sawtooth', 0.5, 70); noise(t, 0.2, 0.3, 1200); }
function sfxRoar() { const t = AC ? AC.currentTime : 0; tone(110, t, 0.6, 'sawtooth', 0.6, 55); noise(t, 0.5, 0.35, 500); }
function sfxStomp() { tone(140, AC ? AC.currentTime : 0, 0.22, 'sine', 0.8, 40); }
function sfxHitBoss() { tone(520, AC ? AC.currentTime : 0, 0.09, 'square', 0.4, 660); }
function sfxWin() { const t = AC ? AC.currentTime : 0; [72, 76, 79, 84, 88].forEach((n, i) => tone(midiHz(n), t + i * 0.11, 0.28, 'square', 0.22)); }
function sfxLose() { const t = AC ? AC.currentTime : 0; [72, 67, 64, 60].forEach((n, i) => tone(midiHz(n), t + i * 0.16, 0.3, 'triangle', 0.35)); }

/* ============ 输入 ============ */
const keys = {};
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!e.repeat) queueJump();
  } else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMusic();
  else if (e.code === 'Enter') {
    if (game.mode === 'title') startGame();
    else if (game.mode === 'gameover' || game.mode === 'victory') startGame();
  }
});
function queueJump() {
  if (game.mode === 'title') { startGame(); return; }
  if (game.mode === 'pause') { return; }
  if (game.mode === 'running' || game.mode === 'boss' || game.mode === 'bossintro') {
    ensureAudio();
    pl.jumpBuf = 0.14;
  }
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (game.mode === 'title') { startGame(); return; }
  if (game.mode === 'running' || game.mode === 'boss' || game.mode === 'bossintro') {
    ensureAudio();
    pl.jumpBuf = 0.14;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && game.mode !== 'title') setPaused(true); });

/* ============ 游戏状态 ============ */
const game = {
  mode: 'title', t: 0, runT: 0, speed: 330, scroll: 0,
  score: 0, combo: 0, maxCombo: 0, hearts: 3,
  notesGot: 0, goal: 22,
  bossHp: 8, bossMax: 8, bossActive: false, bossIntroT: 0, bossFlash: 0,
  nextSpawnBeat: 4, nextBossBeat: 0, lastPattern: '',
  obstacles: [], notes: [], waves: [], parts: [], pops: [], confetti: [],
  invuln: 0, shake: 0, hitStop: 0, winT: 0, best: 0
};
try { game.best = parseInt(localStorage.getItem('guguBest') || '0', 10) || 0; } catch (e) { game.best = 0; }

const pl = { x: 170, y: GROUND, w: 58, h: 64, vy: 0, jumps: 0, grounded: true, coyote: 0,
             jumpBuf: 0, runPhase: 0, squashX: 1, squashY: 1, rot: 0, invuln: 0 };
const boss = { x: W - 190, y: GROUND, w: 118, h: 128, homeX: W - 190, vx: 0, vy: 0,
               mode: 'idle', timer: 0, squash: 1, flash: 0, active: false, bob: 0 };

/* ============ 重置 ============ */
function resetGame() {
  game.mode = 'running'; game.t = 0; game.runT = 0; game.speed = 330; game.scroll = 0;
  game.score = 0; game.combo = 0; game.maxCombo = 0; game.hearts = 3;
  game.notesGot = 0; game.bossHp = game.bossMax; game.bossActive = false; game.bossIntroT = 0;
  game.nextSpawnBeat = currentBeat() + 3; game.nextBossBeat = 0; game.lastPattern = '';
  game.obstacles = []; game.notes = []; game.waves = []; game.parts = []; game.pops = []; game.confetti = [];
  game.invuln = 0; game.shake = 0; game.hitStop = 0; game.winT = 0;
  pl.x = 170; pl.y = GROUND; pl.vy = 0; pl.jumps = 0; pl.grounded = true; pl.coyote = 0;
  pl.jumpBuf = 0; pl.squashX = 1; pl.squashY = 1; pl.rot = 0; pl.invuln = 0;
  boss.x = boss.homeX; boss.y = GROUND; boss.vx = 0; boss.vy = 0;
  boss.mode = 'idle'; boss.timer = 0; boss.squash = 1; boss.flash = 0; boss.active = false; boss.bob = 0;
  elBossWrap.style.display = 'none';
  hideScreen($('screenPause'));
}
/* ============ 生成与实体 ============ */
function noteAt(x, y, bossNote, v) {
  return { x, y, r: 20, taken: false, spawnX: x, spawnBeat: currentBeat(), kind: 'note', bossNote: !!bossNote, v: v || 0 };
}
function noteArriveBeat(n) { return n.spawnBeat + (n.spawnX - pl.x) / game.speed / BEAT; }

function spawnNoteLine() {
  const baseX = W + 60, n = 4 + (Math.random() < 0.5 ? 1 : 0), sp = game.speed * 0.45;
  for (let i = 0; i < n; i++) {
    game.notes.push(noteAt(baseX + i * sp, (i % 2 === 0 ? GROUND - 30 : GROUND - 112)));
  }
}
function spawnObstacle() {

    const t = Math.random();

    else if (t < 0.82) game.obstacles.push({ x, y: GROUND - 58, w: 56, h: 58, kind: 'block', dead: false });

function spawnMixed() {

function spawnPattern() {
  const r = Math.random(), rush = game.runT > 28 && Math.random() < 0.4;

/* ============ 玩家物理 ============ */
function updatePlayer(dt) {
  pl.jumpBuf = Math.max(0, pl.jumpBuf - dt);
  pl.coyote = pl.grounded ? 0.09 : Math.max(0, pl.coyote - dt);
  const wasGround = pl.grounded;
  pl.vy += GRAV * dt;
  pl.y += pl.vy * dt;
  if (pl.y >= GROUND) {
    if (!wasGround) landFX();
    pl.y = GROUND; pl.vy = 0; pl.grounded = true; pl.jumps = 0;
  } else pl.grounded = false;
  pl.invuln = Math.max(0, pl.invuln - dt);

  if (pl.jumpBuf > 0) {
    if (pl.grounded || pl.coyote > 0) doJump(JUMP_V, false);
    else if (pl.jumps < 2) doJump(JUMP_V2, true);
  }
  if (pl.grounded) pl.runPhase += dt * (11 + game.speed * 0.012);
  pl.squashX += (1 - pl.squashX) * Math.min(1, dt * 11);
  pl.squashY += (1 - pl.squashY) * Math.min(1, dt * 11);
  pl.rot += (0 - pl.rot) * Math.min(1, dt * 7);
}
function doJump(v, dbl) {
  pl.vy = -v; pl.grounded = false; pl.coyote = 0; pl.jumpBuf = 0;
  pl.squashX = 1.35; pl.squashY = 0.68;
  if (dbl) { pl.jumps = 2; pl.rot = -0.5; sfxDoubleJump(); }
  else { pl.jumps = 1; sfxJump(); }
  spawnDust(pl.x, GROUND, 5);
}
function landFX() {
  pl.squashX = 0.72; pl.squashY = 1.32; pl.rot = 0;
  spawnDust(pl.x, GROUND, 8);
}

/* ============ 跑酷阶段 ============ */
function updateRunning(dt) {
  game.runT += dt;
  game.speed = Math.min(500, 330 + game.runT * 2.0 + game.notesGot * 3.0);
  const beat = currentBeat();
  let guard = 0;
  while (beat >= game.nextSpawnBeat && guard++ < 3) spawnPattern();
  moveEntities(dt);
  collisions();
  cleanEntities();
}
function moveEntities(dt) {
  for (const o of game.obstacles) o.x -= game.speed * dt;
  for (const n of game.notes) n.x -= (n.v || game.speed) * dt;
  for (const w of game.waves) w.x -= w.v * dt;
}
function cleanEntities() {
  game.obstacles = game.obstacles.filter(o => !o.dead && o.x > -80);
  game.notes = game.notes.filter(n => !n.taken && n.x > -80);
  game.waves = game.waves.filter(w => !w.dead && w.x > -80);
}

/* ============ BOSS 战 ============ */
function startBossIntro() {
  game.mode = 'bossintro'; game.bossIntroT = 2.3;
  boss.active = true; elBossWrap.style.display = 'flex';
  bannerShow('危险！doro 出现了！');
  sfxRoar(); game.shake = 16;
  for (const n of game.notes) spawnBurst(n.x, n.y, '#ffffff', 4);
  game.notes = []; game.obstacles = []; game.waves = [];
}
function updateBossIntro(dt) {
  game.bossIntroT -= dt;
  boss.x += (boss.homeX - boss.x) * Math.min(1, dt * 2.2);
  boss.bob += dt * 3;
  if (game.bossIntroT <= 0) {
    game.mode = 'boss'; game.nextBossBeat = currentBeat() + 2;
    boss.mode = 'idle'; boss.x = boss.homeX;
  }
}
function startBossPattern() {
  const low = game.bossHp <= game.bossMax * 0.4;
  const pool = low ? ['dash', 'dash', 'shock', 'volley', 'volley', 'spikes', 'slam'] : ['dash', 'shock', 'volley', 'volley', 'spikes', 'slam'];
  let p = pick(pool);
  if (p === game.lastPattern) p = pick(pool);
  game.lastPattern = p;
  boss.mode = p + 'Telegraph';
  boss.timer = p === 'dash' ? 0.55 : p === 'shock' ? 0.5 : p === 'volley' ? 0.65 : p === 'spikes' ? 0.65 : 0.7;
  const len = p === 'dash' ? 5 : p === 'shock' ? 6 : p === 'volley' ? 10 : p === 'spikes' ? 9 : 8;
  game.nextBossBeat = currentBeat() + len + 1;
}
function startVolley() {
  boss.mode = 'volley'; boss.timer = 1.2; boss.squash = 1.2;
  const x0 = boss.x - 100;
  for (let i = 0; i < 4; i++) {
    game.notes.push(noteAt(x0 - i * 350, (i % 2 === 0 ? GROUND - 30 : GROUND - 112), true, 440));
  }
}
function startSpikes() {
  boss.mode = 'spikes'; boss.timer = 1.2; boss.squash = 1.2;
  const x0 = boss.x - 100;
  for (let i = 0; i < 4; i++) {
    game.waves.push({ x: x0 - i * 420, y: i % 2 === 0 ? GROUND - 14 : GROUND - 116, w: 40, h: 34, v: 460, kind: 'spiky', dead: false });
  }
}
function updateBoss(dt) {
  boss.flash = Math.max(0, boss.flash - dt);
  boss.squash += (1 - boss.squash) * Math.min(1, dt * 10);
  if (game.mode === 'boss' && boss.mode === 'idle' && currentBeat() >= game.nextBossBeat) startBossPattern();
  switch (boss.mode) {
    case 'idle': boss.bob += dt * 3; break;
    case 'dashTelegraph':
      boss.squash = 0.8; boss.timer -= dt;
      if (boss.timer <= 0) { boss.mode = 'dash'; boss.vx = -680; sfxStomp(); }
      break;
    case 'dash':
      boss.x += boss.vx * dt;
      if (boss.x < 130) boss.vx = 560;
      if (boss.x >= boss.homeX) { boss.x = boss.homeX; boss.vx = 0; boss.mode = 'idle'; spawnDust(boss.x, GROUND, 6); }
      break;
    case 'shockTelegraph':
      boss.squash = 1.25; boss.timer -= dt;
      if (boss.timer <= 0) {
        boss.mode = 'idle'; sfxStomp(); game.shake = 8;
        game.waves.push({ x: boss.x - 60, y: GROUND - 16, w: 46, h: 26, v: 460, kind: 'wave', dead: false });
        game.waves.push({ x: boss.x - 405, y: GROUND - 16, w: 46, h: 26, v: 460, kind: 'wave', dead: false });
      }
      break;
    case 'volleyTelegraph':
      boss.squash = 0.85; boss.timer -= dt;
      if (boss.timer <= 0) startVolley();
      break;
    case 'volley':
      boss.bob += dt * 3; boss.timer -= dt;
      if (boss.timer <= 0) boss.mode = 'idle';
      break;
    case 'spikesTelegraph':
      boss.squash = 0.85; boss.timer -= dt;
      if (boss.timer <= 0) startSpikes();
      break;
    case 'spikes':
      boss.bob += dt * 3; boss.timer -= dt;
      if (boss.timer <= 0) boss.mode = 'idle';
      break;
    case 'slamTelegraph':
      boss.squash = 1.3; boss.timer -= dt;
      if (boss.timer <= 0) { boss.mode = 'slam'; boss.vy = -720; }
      break;
    case 'slam':
      boss.vy += GRAV * 1.1 * dt; boss.y += boss.vy * dt;
      if (boss.y >= GROUND) {
        boss.y = GROUND; boss.vy = 0; boss.mode = 'idle';

        game.waves.push({ x: boss.x - 40, y: GROUND - 16, w: 46, h: 26, v: 520, kind: 'wave', dead: false });
        game.waves.push({ x: boss.x - 430, y: GROUND - 16, w: 46, h: 26, v: 520, kind: 'wave', dead: false });
      }
      break;
    case 'stun': boss.bob += dt; break;
  }
  // 冲刺去程有伤害，返程安全；判定箱低于玩家跳跃最高点，保证可躲避
  if (boss.mode === 'dash' && boss.vx < 0 && game.mode === 'boss') {
    if (overlap(plBox(), { x: boss.x - 52, y: boss.y - 88, w: 104, h: 88 })) damagePlayer();
  }
}

/* ============ 碰撞 / 计分 ============ */
function plBox() { return { x: pl.x - 29, y: pl.y - 64, w: 58, h: 64 }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function damagePlayer() {
  if (game.invuln > 0 || (game.mode !== 'running' && game.mode !== 'boss')) return;
  if (DEMO) console.log('DEMO|HURT|t=' + game.t.toFixed(1) + '|mode=' + game.mode + '|bossMode=' + boss.mode + '|bossVx=' + boss.vx.toFixed(0) + '|hearts=' + game.hearts + '|py=' + pl.y.toFixed(0) + '|jumps=' + pl.jumps);
  game.hearts--; game.invuln = 1.3; pl.invuln = 1.3; game.shake = 10; game.hitStop = 0.07;
  sfxHurt(); game.combo = 0;
  addPop(pl.x, pl.y - 92, '咕！', '#ff4d8d');
  spawnBurst(pl.x, pl.y - 40, '#ff4d8d', 10);
  if (game.hearts <= 0) gameOver();
}
function collectNote(n) {
  n.taken = true;
  if (n.bossNote) {
    game.bossHp--; boss.flash = 0.25; game.shake = Math.max(game.shake, 4);
    sfxHitBoss(); sfxCollect();
    addPop(boss.x, boss.y - 175, '-1 HP', '#ffd34d');
    spawnBurst(n.x, n.y, '#ffd34d', 8);
    if (game.bossHp <= 0) victory();
    return;
  }
  const offset = Math.abs(currentBeat() - noteArriveBeat(n));
  const perfect = offset < 0.16;
  game.combo++; game.maxCombo = Math.max(game.maxCombo, game.combo);
  game.notesGot++;
  const add = (perfect ? 100 : 50) + Math.min(100, game.combo * 8);
  game.score += add;
  sfxCollect();
  addPop(n.x, n.y - 34, (perfect ? 'PERFECT +' : 'GOOD +') + add, perfect ? '#ffd34d' : '#7ad7a8');
  spawnBurst(n.x, n.y, perfect ? '#ffd34d' : '#7ad7a8', perfect ? 12 : 7);
  if (game.notesGot >= game.goal && !boss.active && game.mode === 'running') startBossIntro();
}
function collisions() {
  const pb = plBox();
  for (const o of game.obstacles) {
    if (overlap(pb, o)) { damagePlayer(); o.dead = true; break; }
  }
  for (const w of game.waves) {
    if (overlap(pb, w)) { damagePlayer(); w.dead = true; break; }
  }
  for (const n of game.notes) {
    if (n.taken) continue;
    if (Math.abs(n.x - pl.x) < n.r + 26 && Math.abs(n.y - (pl.y - 32)) < n.r + 30) collectNote(n);
    else if (!n.bossNote && n.x < pl.x - 48 && game.mode === 'running' && game.combo >= 5) {
      n.taken = true; game.combo = 0; addPop(n.x, n.y - 30, 'MISS', '#c9a8d9');
    }
  }
}

/* ============ 主更新 ============ */
function update(dt) {
  game.t += dt;
  game.shake = Math.max(0, game.shake - dt * 26);
  game.invuln = Math.max(0, game.invuln - dt);
  if (game.hitStop > 0) { game.hitStop -= dt; return; }

  if (game.mode === 'running') { updatePlayer(dt); updateRunning(dt); }
  else if (game.mode === 'bossintro') { updatePlayer(dt); updateBossIntro(dt); moveEntities(dt); cleanEntities(); }
  else if (game.mode === 'boss') { updatePlayer(dt); updateBoss(dt); moveEntities(dt); collisions(); cleanEntities(); }
  else if (game.mode === 'victory') { updatePlayer(dt); boss.bob += dt * 2; moveEntities(dt); cleanEntities(); }

  for (const p of game.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; }
  game.parts = game.parts.filter(p => p.t < p.life);
  for (const p of game.pops) p.t += dt;
  game.pops = game.pops.filter(p => p.t < p.life);
  for (const c of game.confetti) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    if (c.y > H + 20) { c.y = -20; c.x = rand(0, W); }
  }
  game.scroll += game.speed * dt;
  if (game.mode === 'running' || game.mode === 'boss' || game.mode === 'bossintro' || game.mode === 'bossintro') updateHud();
}

function updateHud() {
  elScore.textContent = game.score;
  if (game.combo >= 2) { elCombo.classList.add('show'); elComboVal.textContent = game.combo; }
  else elCombo.classList.remove('show');
  elBossFill.style.width = Math.max(0, Math.round(game.bossHp / game.bossMax * 100)) + '%';
}
let lastHearts = -1;
function updateHearts() {
  if (game.hearts === lastHearts) return;
  lastHearts = game.hearts;
  let s = '';
  for (let i = 0; i < 3; i++) {
    const on = i < game.hearts;
    s += '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z" fill="' + (on ? '#ff4d8d' : '#d8c2e8') + '" stroke="#fff" stroke-width="1.5"/></svg>';
  }
  elHearts.innerHTML = s;
}
/* ============ 渲染 ============ */
const TAU = Math.PI * 2;
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawStar(cx, cy, R, rot, color, stroke) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? R : R * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}
const deco = (function () {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const arr = [];
  for (let i = 0; i < 18; i++) arr.push({ x: rnd() * 1500, y: 60 + rnd() * 300, s: 0.5 + rnd() * 1.1, t: rnd() * 6, type: i % 3 === 0 ? 'note' : 'star', a: 0.35 + rnd() * 0.4 });
  return arr;
})();
function drawBackground() {
  const s = (H * 1.16) / imgs.bg.height;
  const dw = imgs.bg.width * s, dh = imgs.bg.height * s;
  const off = (game.scroll * 0.22) % dw;
  ctx.drawImage(imgs.bg, -off, 0, dw, dh);
  ctx.drawImage(imgs.bg, dw - off, 0, dw, dh);
  for (const d of deco) {
    const x = (((d.x - game.scroll * 0.45) % (W + 100)) + W + 100) % (W + 100) - 50;
    const y = d.y + Math.sin(game.t * 2 + d.t) * 8;
    ctx.globalAlpha = d.a;
    drawStar(x, y, d.type === 'star' ? 7 * d.s : 6 * d.s, game.t * (d.type === 'star' ? 1.4 : 0.9) + d.t, '#ffffff', '');
    ctx.globalAlpha = 1;
  }
}
function drawGround() {
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, '#b79cff'); g.addColorStop(1, '#7b5cf0');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillRect(0, GROUND, W, 5);
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  const off = game.scroll % 52;
  for (let x = -off; x < W; x += 52) {
    ctx.beginPath(); ctx.arc(x, GROUND + 18, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 26, GROUND + 38, 3, 0, TAU); ctx.fill();
  }
}
function drawObstacles() {
  for (const o of game.obstacles) {
    if (o.kind === 'spike') {
      const cx = o.x + o.w / 2, cy = GROUND - o.h / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(74,43,87,.35)'; ctx.shadowBlur = 8;
      const g = ctx.createRadialGradient(cx - 6, cy - 6, 4, cx, cy, 26);
      g.addColorStop(0, '#ff9dbd'); g.addColorStop(1, '#ff4d8d');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6, r = i % 2 === 0 ? 26 : 20;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r * 0.9;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 7, cy - 4, 6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 7, cy - 4, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a2b57';
      ctx.beginPath(); ctx.arc(cx - 8, cy - 4, 2.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, cy - 4, 2.6, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (o.kind === 'block') {
      const bx = o.x, by = o.y, bw = o.w, bh = o.h;
      ctx.save();
      ctx.shadowColor = 'rgba(74,43,87,.35)'; ctx.shadowBlur = 8;

      g.addColorStop(0, '#ffc46b'); g.addColorStop(1, '#ff9344');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(bx + 6, by + 6); ctx.lineTo(bx + bw - 6, by + bh - 6);
      ctx.moveTo(bx + bw - 6, by + 6); ctx.lineTo(bx + 6, by + bh - 6); ctx.stroke();
      ctx.fillStyle = '#4a2b57';

      ctx.beginPath(); ctx.arc(bx + bw * 0.65, by + bh * 0.42, 3.4, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#4a2b57'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';

      ctx.restore();
    } else {
      const bx = o.x, bh = o.h;
      ctx.save();
      const g = ctx.createLinearGradient(bx, 0, bx + o.w, 0);
      g.addColorStop(0, '#9b6bff'); g.addColorStop(1, '#7b4fe0');
      ctx.fillStyle = g;
      roundRect(bx, 0, o.w, bh, 8);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      for (let y = 14; y < bh; y += 28) ctx.fillRect(bx + 6, y, o.w - 12, 8);
      ctx.fillStyle = '#fff';
      ctx.font = '800 24px "Baloo 2",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', bx + o.w / 2, bh * 0.5);
      ctx.restore();
    }
  }
}
function drawWaves() {
  for (const wv of game.waves) {
    if (wv.kind === 'wave') {
      const cx = wv.x + wv.w / 2;
      ctx.save();
      const g = ctx.createLinearGradient(0, GROUND - 20, 0, GROUND);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(94,200,248,.9)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, GROUND, wv.w / 2 + 8, 20, 0, Math.PI, 0, false);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const sx = cx - wv.w / 2 + i * (wv.w / 2 - 4);
        ctx.beginPath(); ctx.moveTo(sx, GROUND - 6 - i * 5);
        ctx.lineTo(sx + 6, GROUND - 2 - i * 5); ctx.lineTo(sx + 12, GROUND - 6 - i * 5); ctx.stroke();
      }
      ctx.restore();
    } else {
      const cx = wv.x + wv.w / 2, cy = wv.y + wv.h / 2;
      ctx.save();
      const g = ctx.createRadialGradient(cx - 5, cy - 5, 3, cx, cy, 24);
      g.addColorStop(0, '#c79bff'); g.addColorStop(1, '#8a4fe0');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 + game.t * 2, r = i % 2 === 0 ? 20 : 14;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 4, cy - 3, 4.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy - 3, 4.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a2b57';
      ctx.beginPath(); ctx.arc(cx - 5, cy - 3, 2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4, cy - 3, 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}
function drawNotes() {
  for (const n of game.notes) {
    const pulse = 1 + Math.sin(game.t * 7 + n.x * 0.01) * 0.08;
    ctx.save();
    ctx.shadowColor = n.bossNote ? 'rgba(255,111,165,.8)' : 'rgba(255,211,77,.85)';
    ctx.shadowBlur = 14;
    drawStar(n.x, n.y, n.r * pulse, game.t * (n.bossNote ? 1.5 : 1.2), n.bossNote ? '#ff6fa5' : '#ffd34d', '#fff');
    ctx.restore();
  }
}
function drawBoss() {
  const bw = 150, bh = 156;
  const bobY = Math.sin(boss.bob) * 5;
  const squash = boss.mode === 'dashTelegraph' ? 0.85 : boss.squash;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  ctx.fillStyle = 'rgba(74,43,87,.25)';
  ctx.beginPath(); ctx.ellipse(0, 6, 54, 12, 0, 0, TAU); ctx.fill();
  if (boss.mode.indexOf('Telegraph') >= 0) {
    ctx.fillStyle = '#ff4d8d';
    ctx.font = '800 42px "Baloo 2",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, -bh / 2 - 36 + Math.sin(game.t * 14) * 3);
  }
  const dw = bw * squash, dh = bh / squash;
  ctx.drawImage(imgs.boss, -dw / 2, -dh + bobY - 4, dw, dh);
  if (boss.flash > 0) {
    ctx.globalAlpha = Math.min(0.75, boss.flash * 3.4);
    ctx.fillStyle = '#ffffff';
    roundRect(-dw / 2, -dh + bobY - 4, dw, dh, 20);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawPlayer() {
  ctx.fillStyle = 'rgba(74,43,87,.22)';
  ctx.beginPath();
  ctx.ellipse(pl.x, GROUND + 3, 30 * (pl.grounded ? 1 : 0.7), 7, 0, 0, TAU);
  ctx.fill();
  const bob = game.mode === 'title' ? Math.sin(game.t * 3) * 4 : Math.sin(pl.runPhase) * 2.2;
  const w = 86, h = 96;
  ctx.save();
  ctx.translate(pl.x, pl.y);
  if (!pl.grounded) ctx.rotate(pl.rot);
  ctx.scale(pl.squashX, pl.squashY);
  if (pl.invuln > 0 && Math.sin(game.t * 26) > 0) ctx.globalAlpha = 0.35;
  ctx.drawImage(imgs.player, -w / 2, -h + bob - 2, w, h);
  ctx.restore();
}
function drawParticles() {
  for (const p of game.parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawPops() {
  for (const p of game.pops) {
    const a = Math.max(0, 1 - p.t / p.life);
    const scale = p.t < 0.12 ? 0.5 + p.t / 0.12 * 0.6 : 1.1 - Math.min(0.1, (p.t - 0.12) * 0.2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y - p.t * 58);
    ctx.scale(scale, scale);
    ctx.font = '800 20px "Baloo 2",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}
function drawConfetti() {
  for (const c of game.confetti) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
}
function render() {
  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
  drawBackground();
  drawGround();
  if (game.mode !== 'title') {
    drawObstacles();
    drawWaves();
    drawNotes();
    if (boss.active) drawBoss();
    drawPlayer();
  } else {
    drawPlayer();
  }
  drawParticles();
  drawPops();
  drawConfetti();
  ctx.restore();
}

/* ============ 界面与控制 ============ */
function showScreen(el) { el.classList.remove('hidden'); }
function hideScreen(el) { el.classList.add('hidden'); }
function hideAllScreens() { ['screenTitle', 'screenPause', 'screenOver', 'screenWin'].forEach(id => $(id).classList.add('hidden')); }
function bannerShow(text) {
  banner.textContent = text;
  banner.classList.remove('pop'); void banner.offsetWidth; banner.classList.add('pop');
}
function startGame() {
  if (!imgReady) return;
  ensureAudio();
  resetGame();
  hideAllScreens();
  lastHearts = -1; updateHearts();
}
function toTitle() {
  game.mode = 'title';
  if (AC) AC.suspend();
  hideScreen($('screenPause'));
  hideAllScreens(); showScreen($('screenTitle'));
  elBossWrap.style.display = 'none';
  game.obstacles = []; game.notes = []; game.waves = []; game.parts = []; game.pops = []; game.confetti = [];
  game.speed = 330; game.scroll = 0; game.bossHp = game.bossMax; boss.active = false;
  boss.x = boss.homeX; boss.y = GROUND; boss.vy = 0; boss.mode = 'idle'; boss.vx = 0;
  pl.y = GROUND; pl.vy = 0; pl.grounded = true; pl.runPhase = 0; pl.squashX = 1; pl.squashY = 1; pl.rot = 0; pl.invuln = 0;
  lastHearts = -1;
}
function setPaused(p) {
  if (p) {
    if (game.mode !== 'running' && game.mode !== 'boss' && game.mode !== 'bossintro') return;
    game.prevMode = game.mode;
    game.mode = 'pause';
    if (AC) AC.suspend();
    showScreen($('screenPause'));
  } else {
    if (game.mode !== 'pause') return;
    game.mode = game.prevMode || 'running';
    if (AC) AC.resume();
    game.nextSpawnBeat = Math.max(currentBeat() + 0.5, game.nextSpawnBeat);
    game.nextBossBeat = Math.max(currentBeat() + 1, game.nextBossBeat);
    hideScreen($('screenPause'));
  }
}
function togglePause() {
  if (game.mode === 'pause') setPaused(false);
  else if (game.mode === 'running' || game.mode === 'boss' || game.mode === 'bossintro') setPaused(true);
}

$('btnStart').addEventListener('click', startGame);
$('btnResume').addEventListener('click', () => setPaused(false));
$('btnRestart').addEventListener('click', startGame);
$('btnQuit').addEventListener('click', toTitle);
$('btnRetry').addEventListener('click', startGame);
$('btnAgain').addEventListener('click', startGame);
$('btnHome').addEventListener('click', toTitle);
$('btnHome2').addEventListener('click', toTitle);
$('btnPause').addEventListener('click', togglePause);
$('btnMute').addEventListener('click', toggleMusic);
$('wrap').addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  if (game.mode === 'title') { startGame(); return; }
  if (game.mode === 'running' || game.mode === 'boss' || game.mode === 'bossintro') {
    ensureAudio(); pl.jumpBuf = 0.14;
  }
});

/* ============ 自动演示（?demo=1 启用） ============ */
const DEMO = /[?&]demo=1/.test(location.search);
let demoLogT = -1;
function demoLog() {
  if (!DEMO) return;
  const t = Math.floor(game.t);
  if (t !== demoLogT) {
    demoLogT = t;
    if (t % 3 === 0) console.log('DEMO|t=' + t + '|mode=' + game.mode + '|score=' + game.score + '|notes=' + game.notesGot + '|hearts=' + game.hearts + '|bossHp=' + game.bossHp + '|ob=' + game.obstacles.length + '|notesN=' + game.notes.length + '|waves=' + game.waves.length);
  }
}
function demoThink() {
  if (!DEMO) return;
  if (game.mode !== 'running' && game.mode !== 'boss') return;
  const spd = game.speed;
  if (!(pl.grounded || pl.coyote > 0)) return;
  const danger = game.obstacles.some(o => o.y > GROUND - 130 && o.x > pl.x + 10 && o.x < pl.x + spd * 0.32)
    || game.waves.some(w => w.kind === 'wave' && w.x > pl.x + 10 && w.x < pl.x + 210)
    || game.waves.some(w => w.kind === 'spiky' && w.y > GROUND - 60 && w.x > pl.x + 10 && w.x < pl.x + 200);
  const highNote = game.notes.some(n => !n.taken && n.y < GROUND - 70 && n.x > pl.x - 10 && n.x < pl.x + (n.v || spd) * 0.4);
  const bossDash = boss.active && boss.mode === 'dash' && boss.x > pl.x - 60 && boss.x < pl.x + 240;
  if (danger || highNote || bossDash) pl.jumpBuf = Math.max(pl.jumpBuf, 0.14);
}

/* ============ 主循环 ============ */
let lastT = performance.now();
function frame(ts) {
  const dt = Math.min(0.033, (ts - lastT) / 1000);
  lastT = ts;
  if (DEMO && imgReady && game.mode === 'title') startGame();
  demoThink();
  demoLog();
  update(dt);
  render();
  updateHearts();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script>
setTimeout(function(){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.add('hidden'); });
  game.mode = 'boss'; boss.active = true; boss.x = 770; boss.y = GROUND; game.bossHp = 8; game.speed = 0;
  game.obstacles.push({x:760,y:GROUND-46,w:46,h:46,kind:'spike',dead:false});
  game.obstacles.push({x:640,y:GROUND-58,w:56,h:58,kind:'block',dead:false});
  game.obstacles.push({x:520,y:0,w:46,h:GROUND-104,kind:'barrier',dead:false});
  game.notes.push({x:700,y:GROUND-112,r:20,taken:false,spawnX:0,spawnBeat:0,kind:'note',bossNote:true,v:0});
  game.notes.push({x:600,y:GROUND-30,r:20,taken:false,spawnX:0,spawnBeat:0,kind:'note',bossNote:true,v:0});
  game.waves.push({x:680,y:GROUND-16,w:46,h:26,v:0,kind:'wave',dead:false});
  game.waves.push({x:560,y:GROUND-116,w:40,h:34,v:0,kind:'spiky',dead:false});
  render(); updateHearts();
}, 300);
</script>
